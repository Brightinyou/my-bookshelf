name: Windows Installer Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'core/**'
      - 'dev/installer/**'
      - '*.bat'
      - '*.vbs'
      - 'MyBookshelf.exe'
      - 'MyBookshelf.ico'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: cmd

      - name: Fetch Poppler
        run: powershell -NoProfile -ExecutionPolicy Bypass -File dev/installer/fetch-poppler.ps1
        shell: cmd

      - name: Build installer
        run: iscc "dev\installer\MyBookshelf.iss"
        shell: cmd

      - name: Get version
        id: ver
        run: |
          $v = (Select-String '#define MyAppVersion\s+"(.+)"' dev/installer/MyBookshelf.iss).Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Zip installer
        run: Compress-Archive -Path dist/windows/Setup.exe -DestinationPath "dist/windows/MyBookshelf-Setup-v${{ steps.ver.outputs.version }}.zip" -Force
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBookshelf-Setup-v${{ steps.ver.outputs.version }}
          path: |
            dist/windows/Setup.exe
            dist/windows/MyBookshelf-Setup-v${{ steps.ver.outputs.version }}.zip
          retention-days: 30

      - name: Add Windows files to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/Setup.exe
            dist/windows/MyBookshelf-Setup-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
